name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify C++ toolchain
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -version '[18.0,19.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio 2026 C++ tools are required.' }
      - name: Prepare OBS runtime
        shell: pwsh
        run: ./scripts/prepare-obs.ps1
      - name: Build, test and package
        shell: pwsh
        run: |
          $expected = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '' }
          ./scripts/package.ps1 -ObsRoot "$pwd/.deps/obs-runtime-32.2.2" -ExpectedVersion $expected
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/releases/
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2025-vs2026
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist/releases/
      - name: Publish complete release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VPK_TOKEN: ${{ github.token }}
        run: |
          dotnet tool restore
          if ($LASTEXITCODE) { throw 'Tool restore failed.' }
          ./scripts/publish-release.ps1 -Version $env:GITHUB_REF_NAME.TrimStart('v') -Repository $env:GITHUB_REPOSITORY
