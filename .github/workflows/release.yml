name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2025-vs2026
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # Run workflow_dispatch on master once after changing dependency pins.
      # Release tags can reuse the default branch cache, but not other tags' caches.
      - name: Cache pinned build dependencies
        uses: actions/cache@v4
        with:
          path: |
            .deps/obs-src
            .deps/imgui
            .deps/ffmpeg-src
            .deps/velopack-*
            ~/.nuget/packages
          key: windows-deps-v1-${{ hashFiles('scripts/build.ps1', 'scripts/velopack.ps1', '.config/dotnet-tools.json') }}
      - name: Verify C++ toolchain
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -version '[18.0,19.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio 2026 C++ tools are required.' }
      - name: Prepare OBS runtime
        shell: pwsh
        run: ./scripts/prepare-obs.ps1
      - name: Build, test and package
        shell: pwsh
        run: |
          $expected = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '' }
          ./scripts/package.ps1 -ObsRoot "$pwd/.deps/obs-runtime-32.2.2" -ExpectedVersion $expected
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: windows-release
          path: dist/releases/
          if-no-files-found: error
          compression-level: 0
      - name: Publish complete release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VPK_TOKEN: ${{ github.token }}
        run: |
          ./scripts/publish-release.ps1 -Version $env:GITHUB_REF_NAME.TrimStart('v') -Repository $env:GITHUB_REPOSITORY
